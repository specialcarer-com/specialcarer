# SpecialCarer CI test gate
#
# Runs `npm test` on every PR and every push to main. No allow-list: any
# test failure fails the job.
#
# History: from PR #239 (commit af05ce9, 16 Sep 2026) through PR #258,
# this file encoded a strict allow-list of 8 known pre-existing `not ok`
# TAP lines across 3 files (buildIcs.test.ts, handlers.test.ts,
# grace-period-blast.test.ts, bacs18.test.ts) under a standing "do NOT
# investigate" rule. PR #258 root-caused and fixed all of them (a stale
# PR #143 rebrand regex in two calendar test files, a module-scope
# ./smtp import crashing grace-period-blast.test.ts at load time, and a
# process.exit() call racing the node --test runner's lifecycle in
# bacs18.test.ts). With the real failure count now at zero, the
# allow-list is removed rather than carried forward.

name: test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm test
