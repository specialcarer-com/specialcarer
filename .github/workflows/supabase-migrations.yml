name: Apply Supabase migrations

# Manual-only fallback after the 10 Sep 2026 migration-history reconciliation:
#   • PR #191 renamed drifted files + split bundles into per-ledger-version files.
#   • PR #193 reconstructed 54 orphan migration files from live prod schema.
#   • A single zombie migration (20260707113000_profiles_country_fk_to_countries)
#     was registered in the ledger via a targeted INSERT (10 Sep 2026).
# Repo files (171) and prod ledger (171 rows) are now fully aligned.
#
# This workflow is intentionally manual-only for the first stabilisation
# window. Re-enable the automatic `push` trigger once several manual runs
# have completed without drift.
on:
  workflow_dispatch:

# Prevent two runs from racing each other against prod.
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

jobs:
  apply:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: qupjaanyhnuvlexkwtpq
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: supabase db push --linked --include-all -p "$SUPABASE_DB_PASSWORD"
