name: Cloudflare bundle analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      NODE_OPTIONS: "--max-old-space-size=6144"
      # Synthetic, deliberately unusable credentials. Never contact production.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:9"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "compatibility-build-placeholder"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:9"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_compatibility_placeholder"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare Workers bundle
        run: npm run cf:build
      - name: Upload bundle analysis metafile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-bundle-metafile
          path: .open-next/server-functions/default/handler.mjs.meta.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
